<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CattleTrack Navbar</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100">

    <!-- Navbar -->
    <header class="bg-green-800 text-white shadow-lg">

        <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

            <!-- Logo -->
            <a href="#home"
               class="rounded text-2xl font-bold focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-white">
                Cattle<span class="text-lime-300">Track</span>
            </a>

            <!-- Desktop Navigation -->
            <nav class="hidden items-center gap-8 md:flex"
                 aria-label="Main navigation">

                <a href="#"
                   class="rounded px-3 py-2 hover:bg-green-700 hover:text-lime-300 focus-visible:outline-2 focus-visible:outline-white">
                    Home
                </a>

                <a href="#"
                   class="rounded px-3 py-2 hover:bg-green-700 hover:text-lime-300 focus-visible:outline-2 focus-visible:outline-white">
                    GPS Tracking
                </a>

                <a href="#"
                   class="rounded px-3 py-2 hover:bg-green-700 hover:text-lime-300 focus-visible:outline-2 focus-visible:outline-white">
                    Animal Health
                </a>

                <a href="#"
                   class="rounded px-3 py-2 hover:bg-green-700 hover:text-lime-300 focus-visible:outline-2 focus-visible:outline-white">
                    Contact Us
                </a>

            </nav>

            <!-- Mobile Hamburger Menu -->
            <details class="relative md:hidden">

                <summary
                    aria-label="navigation menu"
                    class="flex cursor-pointer list-none flex-col gap-1.5 rounded p-2 hover:bg-green-700 focus-visible:outline-2 focus-visible:outline-white">

                    <span class="h-0.5 w-7 bg-white"></span>
                    <span class="h-0.5 w-7 bg-white"></span>
                    <span class="h-0.5 w-7 bg-white"></span>

                </summary>

                <!-- Mobile Links -->
                <nav
                    aria-label="Mobile navigation"
                    class="absolute right-0 top-full z-10 mt-4 flex w-56 flex-col gap-2 rounded-lg bg-green-800 p-4 shadow-xl">

                    <a href="#home"
                       class="rounded px-4 py-3 hover:bg-green-700 hover:text-lime-300 focus-visible:outline-2 focus-visible:outline-white">
                        Home
                    </a>

                    <a href="#gps"
                       class="rounded px-4 py-3 hover:bg-green-700 hover:text-lime-300 focus-visible:outline-2 focus-visible:outline-white">
                        GPS Tracking
                    </a>

                    <a href="#health"
                       class="rounded px-4 py-3 hover:bg-green-700 hover:text-lime-300 focus-visible:outline-2 focus-visible:outline-white">
                        Animal Health
                    </a>

                    <a href="#contact"
                       class="rounded px-4 py-3 hover:bg-green-700 hover:text-lime-300 focus-visible:outline-2 focus-visible:outline-white">
                        Contact Us
                    </a>

                </nav>

            </details>

        </div>

    </header>

   
    <main id="home" class="mx-auto max-w-7xl px-6 py-16">

        <h1 class="text-3xl font-bold text-green-800 md:text-5xl text-center">
            Welcome to CattleTrack
        </h1>

        <p class="mt-4 text-lg text-gray-600 text-center">
            Smart livestock management and GPS tracking.
        </p>

    </main>

</body>
</html>
